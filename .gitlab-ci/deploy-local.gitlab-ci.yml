post_build_local:
    extends:
        - .post_build
        - .deploy:local:rules
    needs: ["build_image"]
    environment:
        name: LOCAL

deploy_local:
    extends:
        - .base_deploy_swarm_service
        - .deploy:local:rules
    needs: ["post_build_local"]
    variables:
        SERVER_IP: $LOCAL_IP
        SERVER_USER: $LOCAL_USER
        SERVER_PORT: $LOCAL_SSH_PORT
        SWARM_NODES: $LOCAL_SWARM_CLUSTER
        DOCKER_PUBLIC_PORT: 8004
        DOCKER_PRIVATE_PORT: 8004
        DOCKER_NETWORK_NAME: lumi-network
        SWARM_REPLICAS: 1
        NODE_LABEL: L1
    environment:
        name: LOCAL
