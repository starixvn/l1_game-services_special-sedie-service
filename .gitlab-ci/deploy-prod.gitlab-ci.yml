post_build_prod:
    extends:
        - .post_build
        - .deploy:prod:rules
    needs: ["build_image"]
    environment:
        name: PROD

deploy_prod:
    extends:
        - .base_deploy_kbt
        - .deploy:prod:rules
    needs: ["post_build_prod"]
    variables:
        SERVER_IP: $PROD_IP
        SERVER_USER: $PROD_USER
        SERVER_PORT: $PROD_SSH_PORT
        DOCKER_PUBLIC_PORT: 8002
        DOCKER_PRIVATE_PORT: 8002
    environment:
        name: PROD
